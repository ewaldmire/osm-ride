<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="128" height="128">
  <!-- "Oath Strong" badge concept: silver merit-badge-style border around the
       existing brand green, with a reef/square-knot glyph swapped in for the
       bike (the bike stays on the ride-screen avatar, ic_bike_avatar.xml -
       this only replaces the main app icon). The knot's geometry is the real
       Wikimedia Commons "Square knot.svg" diagram (public domain), recolored
       and refit, not hand-drawn - see app/src/main/res/drawable/ic_launcher_foreground.xml
       for the identical Android version and the reasoning behind the path
       order (it's what makes the grey strand's tail cross over the white
       loop on the left while its own belly curve stays under it, matching a
       real square knot's alternating over/under). -->
  <circle cx="54" cy="54" r="54" fill="#B8BCC2"/>
  <circle cx="54" cy="54" r="49" fill="#2E7D32"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="7.5">
    <path stroke="#B8BCC2" d="M 63.34,37.68 C 52.67,37.68 50.00,47.28 42.00,47.28" />
    <path stroke="#B8BCC2" d="M 42.00,60.72 C 50.00,60.72 52.67,70.32 63.34,70.32" />
    <path stroke="#FFFFFF" d="M 87.34,60.72 L 66.00,60.72 C 58.00,60.72 55.33,70.32 44.66,70.32 M 44.66,37.68 C 55.33,37.68 58.00,47.28 66.00,47.28 L 87.34,47.28" />
    <path stroke="#B8BCC2" d="M 63.34,70.32 C 68.67,70.32 74.00,66.48 74.00,62.64 L 74.00,45.36 C 74.00,41.52 68.67,37.68 63.34,37.68" />
    <path stroke="#FFFFFF" d="M 44.66,70.32 C 39.33,70.32 34.00,66.48 34.00,62.64 L 34.00,45.36 C 34.00,41.52 39.33,37.68 44.66,37.68" />
    <path stroke="#B8BCC2" d="M 42.00,47.28 L 20.66,47.28" />
    <path stroke="#B8BCC2" d="M 20.66,60.72 L 42.00,60.72" />
  </g>
</svg>
