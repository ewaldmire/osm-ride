<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
<div id="map"></div>
<script>
  // Same free, no-API-key OpenFreeMap "Liberty" style used by the Android app's BikeMapView.kt -
  // it ships a "building-3d" fill-extrusion layer already, so tilting the camera is all that's
  // needed to get 3D buildings; no new layer to add for that part.
  const MAX_PITCH_DEGREES = 80;
  // Fraction of the map's height reserved as top padding while following, at full tilt - pushes
  // the camera's focal point toward the bottom of the screen so the bike renders "in the
  // foreground" with the road ahead visible above it, instead of sitting dead-center. Mirrors
  // BikeMapView.kt's RIDE_CAMERA_TOP_PADDING_FRACTION.
  const TOP_PADDING_FRACTION = 0.6;
  // OSM's building:colour tag is too sparse to rely on, so buildings all render the same flat
  // tone by default - bucketing by each building's render_height fakes enough variety to break
  // up the monotony. Same palette as BikeMapView.kt's BUILDING_COLORS.
  const BUILDING_COLORS = ['#C9BBA8', '#B8AFA0', '#A79C8C', '#C08552', '#9C9186'];

  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [0, 0],
    zoom: 2,
  });
  map.setMaxPitch(MAX_PITCH_DEGREES);

  // setRoute/updateBikePosition/etc below all touch sources that only exist once MapLibre's own
  // asynchronous style load finishes (map.on('load') - a network fetch, separate from and later
  // than the WebView's page-load event that the Python side gates on). Calls made from Python
  // between page-load and map-load would otherwise throw on a missing source and silently drop
  // the route, so every such function is queued here until mapReady flips true.
  window.mapReady = false;
  const _pendingMapCalls = [];
  function _whenMapReady(fn) {
    return function (...args) {
      if (window.mapReady) {
        fn(...args);
      } else {
        _pendingMapCalls.push(() => fn(...args));
      }
    };
  }

  // Set when a real touch/mouse gesture (not a programmatic easeTo/flyTo call) moves the camera -
  // e.originalEvent is only present for user-driven interaction. While true, followBike()
  // only recentres on the bike's position and leaves whatever zoom/bearing/tilt/rotation the
  // rider set manually alone, mirroring BikeMapView.kt's manualOverrideActive. Cleared via
  // window.resetManualOverride(), which the UI calls whenever a manual map control is used.
  let manualOverrideActive = false;
  map.on('movestart', (e) => {
    if (e.originalEvent) manualOverrideActive = true;
  });

  map.on('load', () => {
    map.addSource('route', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({
      id: 'route-line',
      type: 'line',
      source: 'route',
      paint: { 'line-color': '#EF6C00', 'line-width': 5 },
    });

    map.addSource('bike', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({
      id: 'bike-marker',
      type: 'circle',
      source: 'bike',
      paint: {
        'circle-radius': 9,
        'circle-color': '#2E7D32',
        'circle-stroke-color': '#ffffff',
        'circle-stroke-width': 2,
      },
    });

    // Route creator only - tapped waypoint dots, mirroring RouteCreatorMapView.kt's CircleLayer.
    map.addSource('waypoints', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({
      id: 'waypoint-dots',
      type: 'circle',
      source: 'waypoints',
      paint: {
        'circle-radius': 7,
        'circle-color': '#1976D2',
        'circle-stroke-color': '#ffffff',
        'circle-stroke-width': 2,
      },
    });

    if (map.getLayer('building-3d')) {
      map.setPaintProperty('building-3d', 'fill-extrusion-color', [
        'interpolate',
        ['linear'],
        ['%', ['to-number', ['get', 'render_height']], BUILDING_COLORS.length],
        0, BUILDING_COLORS[0],
        1, BUILDING_COLORS[1],
        2, BUILDING_COLORS[2],
        3, BUILDING_COLORS[3],
        4, BUILDING_COLORS[4],
      ]);
    }

    window.mapReady = true;
    const pending = _pendingMapCalls.splice(0, _pendingMapCalls.length);
    for (const call of pending) call();
  });

  // Called from Python with an already-JSON-encoded GeoJSON LineString Feature.
  window.setRoute = _whenMapReady(function (geojson) {
    map.getSource('route').setData(geojson);
    const coords = geojson.geometry.coordinates;
    if (coords.length < 2) return;
    const bounds = coords.reduce(
      (b, c) => b.extend(c),
      new maplibregl.LngLatBounds(coords[0], coords[0])
    );
    map.setPadding({ top: 0, bottom: 0, left: 0, right: 0 });
    map.fitBounds(bounds, { padding: 60, duration: 0 });
  });

  window.updateBikePosition = _whenMapReady(function (lon, lat) {
    map.getSource('bike').setData({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [lon, lat] },
      properties: {},
    });
  });

  window.followBike = _whenMapReady(function (lon, lat, zoom, bearing, tiltDegrees) {
    if (manualOverrideActive) {
      map.easeTo({ center: [lon, lat], duration: 900 });
      return;
    }
    const tiltFraction = Math.min(Math.max(tiltDegrees / MAX_PITCH_DEGREES, 0), 1);
    const containerHeight = map.getContainer().clientHeight;
    map.setPadding({ top: containerHeight * TOP_PADDING_FRACTION * tiltFraction, bottom: 0, left: 0, right: 0 });
    map.easeTo({ center: [lon, lat], zoom: zoom, bearing: bearing, pitch: tiltDegrees, duration: 900 });
  });

  window.resetManualOverride = function () {
    manualOverrideActive = false;
  };

  // Route creator only. Off by default (window.enableCreatorMode() turns it on) so the ride
  // screen - which loads this same page but never calls that - doesn't post messages into a
  // handler it never registered.
  window.creatorModeEnabled = false;
  window.enableCreatorMode = function () {
    window.creatorModeEnabled = true;
  };
  map.on('click', (e) => {
    if (!window.creatorModeEnabled) return;
    window.webkit.messageHandlers.waypointTapped.postMessage(
      JSON.stringify({ lon: e.lngLat.lng, lat: e.lngLat.lat })
    );
  });

  window.setWaypoints = _whenMapReady(function (geojson) {
    map.getSource('waypoints').setData(geojson);
  });

  // Same shape as setRoute, but without recentring on every call - the rider is actively
  // tapping the map and a fitBounds jump after each tap would fight their own panning/zooming.
  window.setPreviewRoute = _whenMapReady(function (geojson) {
    map.getSource('route').setData(geojson);
  });

  // Tells Python this script has finished running and every window.* function above is safe to
  // call - a push notification rather than something Python polls for. Needed because WebKit's
  // own "load-changed" FINISHED signal does not reliably mean this script has finished executing
  // by the time the signal is delivered (observed directly: evaluate_javascript() called from a
  // FINISHED handler can still race ahead of this script, even after several-second waits), so
  // polling from the Python side for a marker like this via evaluate_javascript is not
  // trustworthy - only the page's own script knows for certain when it's done.
  if (window.webkit && window.webkit.messageHandlers.pageReady) {
    window.webkit.messageHandlers.pageReady.postMessage('ready');
  }
</script>
</body>
</html>
